<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
    <defs>
      <linearGradient id="bgs" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#052e16"/>
        <stop offset="100%" stop-color="#022c22"/>
      </linearGradient>
      <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#84cc16"/>
        <stop offset="100%" stop-color="#65a30d"/>
      </linearGradient>
    </defs>
    <rect width="400" height="500" fill="url(#bgs)"/>
    <rect x="20" y="20" width="360" height="460" rx="16" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.3"/>
    
    <rect x="40" y="40" width="110" height="26" rx="6" fill="#14532d"/>
    <text x="95" y="58" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">RETRO NOkIA</text>
    
    <text x="200" y="105" fill="#f0fdf4" font-family="sans-serif" font-size="34" font-weight="900" text-anchor="middle">SNAKE WAR</text>
    <text x="200" y="130" fill="#86efac" font-family="sans-serif" font-size="14" text-anchor="middle">ARENAS &amp; BATTLES</text>
    
    <!-- LCD Phone screen -->
    <g transform="translate(60, 150)">
      <rect width="280" height="240" rx="12" fill="url(#screen)" stroke="#3f6212" stroke-width="4"/>
      <!-- Pixel grid feel -->
      <!-- Snake body -->
      <g fill="#14532d">
        <rect x="40" y="60" width="20" height="20" rx="3"/>
        <rect x="65" y="60" width="20" height="20" rx="3"/>
        <rect x="90" y="60" width="20" height="20" rx="3"/>
        <rect x="115" y="60" width="20" height="20" rx="3"/>
        <rect x="115" y="85" width="20" height="20" rx="3"/>
        <rect x="115" y="110" width="20" height="20" rx="3"/>
        <rect x="140" y="110" width="20" height="20" rx="3"/>
        <rect x="165" y="110" width="20" height="20" rx="3"/>
        <rect x="190" y="110" width="20" height="20" rx="3"/>
        <!-- Eyes -->
        <circle cx="196" cy="115" r="2.5" fill="#84cc16"/>
        <circle cx="196" cy="125" r="2.5" fill="#84cc16"/>
        <!-- Tongue -->
        <polygon points="210,120 216,116 216,124" fill="#dc2626"/>
      </g>
      
      <!-- Food / Apple -->
      <g transform="translate(220, 160)">
        <circle cx="10" cy="12" r="10" fill="#dc2626"/>
        <rect x="9" y="0" width="3" height="5" fill="#15803d"/>
      </g>
      
      <!-- Enemy Snake -->
      <g fill="#991b1b">
        <rect x="50" y="180" width="18" height="18" rx="2"/>
        <rect x="70" y="180" width="18" height="18" rx="2"/>
        <rect x="90" y="180" width="18" height="18" rx="2"/>
        <rect x="90" y="160" width="18" height="18" rx="2"/>
      </g>
      
      <!-- Score -->
      <text x="20" y="30" fill="#14532d" font-family="monospace" font-size="14" font-weight="bold">SCORE: 04280</text>
      <text x="210" y="30" fill="#14532d" font-family="monospace" font-size="14" font-weight="bold">LVL: 04</text>
    </g>
    
    <text x="200" y="445" fill="#4ade80" font-family="monospace" font-size="13" text-anchor="middle">J2ME MIDP 2.0 / MULTI-LEVEL</text>
  </svg>