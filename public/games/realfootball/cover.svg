<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
    <defs>
      <linearGradient id="bgf" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f172a"/>
        <stop offset="100%" stop-color="#064e3b"/>
      </linearGradient>
      <linearGradient id="pitch" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#15803d"/>
        <stop offset="100%" stop-color="#166534"/>
      </linearGradient>
    </defs>
    <rect width="400" height="500" fill="url(#bgf)"/>
    <rect x="20" y="20" width="360" height="460" rx="16" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>
    
    <rect x="40" y="40" width="130" height="26" rx="6" fill="#047857"/>
    <text x="105" y="58" fill="#d1fae5" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GAMELOFT STYLE</text>
    
    <text x="200" y="105" fill="#f8fafc" font-family="sans-serif" font-size="30" font-weight="900" text-anchor="middle">REAL FOOTBALL</text>
    <text x="200" y="130" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">2012 EDITION</text>
    
    <!-- Pitch -->
    <g transform="translate(60, 150)">
      <rect width="280" height="240" rx="12" fill="url(#pitch)" stroke="#22c55e" stroke-width="3"/>
      <!-- Pitch lines -->
      <line x1="20" y1="120" x2="260" y2="120" stroke="#86efac" stroke-width="2"/>
      <circle cx="140" cy="120" r="40" fill="none" stroke="#86efac" stroke-width="2"/>
      <circle cx="140" cy="120" r="4" fill="#86efac"/>
      
      <!-- Goal area -->
      <rect x="70" y="20" width="140" height="40" fill="none" stroke="#86efac" stroke-width="2"/>
      <rect x="70" y="180" width="140" height="40" fill="none" stroke="#86efac" stroke-width="2"/>
      
      <!-- Soccer Ball -->
      <g transform="translate(130, 105)">
        <circle cx="15" cy="15" r="14" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
        <polygon points="15,6 23,12 20,21 10,21 7,12" fill="#0f172a"/>
      </g>
      
      <!-- Player 1 -->
      <g transform="translate(90, 80)">
        <circle cx="10" cy="10" r="8" fill="#ef4444"/>
        <text x="10" y="13" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">10</text>
      </g>
      
      <!-- Player 2 -->
      <g transform="translate(170, 135)">
        <circle cx="10" cy="10" r="8" fill="#3b82f6"/>
        <text x="10" y="13" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">7</text>
      </g>
    </g>
    
    <text x="200" y="445" fill="#6ee7b7" font-family="monospace" font-size="13" text-anchor="middle">3D/2D HYBRID / 240x320</text>
  </svg>