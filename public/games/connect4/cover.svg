<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
    <defs>
      <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f172a"/>
        <stop offset="100%" stop-color="#1e1b4b"/>
      </linearGradient>
      <linearGradient id="grid" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2563eb"/>
        <stop offset="100%" stop-color="#1d4ed8"/>
      </linearGradient>
    </defs>
    <rect width="400" height="500" fill="url(#bg4)"/>
    <rect x="20" y="20" width="360" height="460" rx="16" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.3"/>
    
    <!-- Top badge -->
    <rect x="40" y="40" width="120" height="26" rx="6" fill="#1e293b"/>
    <text x="100" y="58" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">NOKIA 240x320</text>
    
    <text x="200" y="110" fill="#f8fafc" font-family="sans-serif" font-size="32" font-weight="900" text-anchor="middle" letter-spacing="1">CONNECT 4</text>
    <text x="200" y="135" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">CLASSIC MOBILE EDITION</text>
    
    <!-- Board -->
    <g transform="translate(60, 160)">
      <rect width="280" height="240" rx="14" fill="url(#grid)" stroke="#60a5fa" stroke-width="3"/>
      <!-- Holes & pieces -->
      <circle cx="40" cy="40" r="22" fill="#ef4444"/>
      <circle cx="95" cy="40" r="22" fill="#0f172a"/>
      <circle cx="150" cy="40" r="22" fill="#eab308"/>
      <circle cx="205" cy="40" r="22" fill="#0f172a"/>
      <circle cx="40" cy="95" r="22" fill="#eab308"/>
      <circle cx="95" cy="95" r="22" fill="#ef4444"/>
      <circle cx="150" cy="95" r="22" fill="#ef4444"/>
      <circle cx="205" cy="95" r="22" fill="#eab308"/>
      <circle cx="40" cy="150" r="22" fill="#ef4444"/>
      <circle cx="95" cy="150" r="22" fill="#eab308"/>
      <circle cx="150" cy="150" r="22" fill="#ef4444"/>
      <circle cx="205" cy="150" r="22" fill="#ef4444"/>
      <circle cx="40" cy="205" r="22" fill="#eab308"/>
      <circle cx="95" cy="205" r="22" fill="#ef4444"/>
      <circle cx="150" cy="205" r="22" fill="#eab308"/>
      <circle cx="205" cy="205" r="22" fill="#eab308"/>
    </g>
    
    <text x="200" y="445" fill="#38bdf8" font-family="monospace" font-size="13" text-anchor="middle">MIDP 2.0 / JAVA ME</text>
