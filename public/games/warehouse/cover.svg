<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
    <defs>
      <linearGradient id="bgw" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#451a03"/>
        <stop offset="100%" stop-color="#1c1917"/>
      </linearGradient>
    </defs>
    <rect width="400" height="500" fill="url(#bgw)"/>
    <rect x="20" y="20" width="360" height="460" rx="16" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3"/>
    
    <rect x="40" y="40" width="120" height="26" rx="6" fill="#78350f"/>
    <text x="100" y="58" fill="#fde68a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SOKOBAN CLASSIC</text>
    
    <text x="200" y="105" fill="#fef3c7" font-family="sans-serif" font-size="34" font-weight="900" text-anchor="middle">WAREHOUSE</text>
    <text x="200" y="130" fill="#d97706" font-family="sans-serif" font-size="14" text-anchor="middle">BOX-PUSHING PUZZLE</text>
    
    <!-- Game field -->
    <g transform="translate(60, 160)">
      <rect width="280" height="230" rx="10" fill="#292524" stroke="#78350f" stroke-width="3"/>
      
      <!-- Brick walls -->
      <g fill="#7f1d1d" stroke="#450a0a" stroke-width="1">
        <rect x="20" y="20" width="40" height="40" rx="4"/>
        <rect x="65" y="20" width="40" height="40" rx="4"/>
        <rect x="110" y="20" width="40" height="40" rx="4"/>
        <rect x="155" y="20" width="40" height="40" rx="4"/>
        <rect x="20" y="65" width="40" height="40" rx="4"/>
        <rect x="20" y="110" width="40" height="40" rx="4"/>
        <rect x="20" y="155" width="40" height="40" rx="4"/>
        <rect x="220" y="20" width="40" height="40" rx="4"/>
        <rect x="220" y="65" width="40" height="40" rx="4"/>
        <rect x="220" y="110" width="40" height="40" rx="4"/>
        <rect x="220" y="155" width="40" height="40" rx="4"/>
      </g>
      
      <!-- Wooden crates -->
      <g transform="translate(75, 75)">
        <rect width="36" height="36" rx="4" fill="#b45309" stroke="#78350f" stroke-width="2"/>
        <line x1="0" y1="0" x2="36" y2="36" stroke="#78350f" stroke-width="2"/>
        <line x1="36" y1="0" x2="0" y2="36" stroke="#78350f" stroke-width="2"/>
      </g>
      <g transform="translate(130, 120)">
        <rect width="36" height="36" rx="4" fill="#d97706" stroke="#92400e" stroke-width="2"/>
        <line x1="0" y1="0" x2="36" y2="36" stroke="#92400e" stroke-width="2"/>
        <line x1="36" y1="0" x2="0" y2="36" stroke="#92400e" stroke-width="2"/>
      </g>
      
      <!-- Target dot -->
      <circle cx="185" cy="90" r="10" fill="none" stroke="#22c55e" stroke-width="3"/>
      <circle cx="185" cy="90" r="4" fill="#22c55e"/>
      
      <!-- Keeper / Worker -->
      <g transform="translate(80, 140)">
        <circle cx="15" cy="12" r="10" fill="#fde047"/>
        <rect x="8" y="22" width="14" height="18" rx="3" fill="#2563eb"/>
        <rect x="10" y="5" width="10" height="6" rx="2" fill="#ef4444"/>
      </g>
    </g>
    
    <text x="200" y="445" fill="#f59e0b" font-family="monospace" font-size="13" text-anchor="middle">MARTIN CAMERON / CLDC 1.1</text>
  </svg>